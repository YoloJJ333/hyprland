general {
    # Used when loginctl requests the session lock.
    # The pidof check prevents another hyprlock from being launched
    # if it is already active.
    lock_cmd = pidof hyprlock || hyprlock

    # Also lock for manual suspend, lid-close suspend, and systemd
    # suspend-then-hibernate events.
    before_sleep_cmd = loginctl lock-session

    # Turn displays back on after a wake event.
    after_sleep_cmd = hyprctl dispatch dpms on

    # Wait until a Wayland locker such as hyprlock has locked the
    # session before allowing system sleep.
    inhibit_sleep = 3
}

listener {
    timeout = 240
    on-timeout = hyprctl hyprsunset gamma 25
    on-resume = hyprctl hyprsunset reset gamma
}

listener {
    timeout = 300
    on-timeout = ~/.config/hypr/hyprland/scripts/update-lock-wallpaper.sh ; loginctl lock-session && hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 600
    # settings: /etc/systemd/sleep.conf.d/10-suspend-then-hibernate.conf
    on-timeout = systemctl suspend-then-hibernate
}
