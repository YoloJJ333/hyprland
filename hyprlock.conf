general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    text_trim = true
}

auth {
    pam:enabled = true
    pam:module = hyprlock
}

animations {
    enabled = true
    bezier = smooth, 0.25, 0.1, 0.25, 1.0
    animation = fadeIn, 1, 1.5, smooth
    animation = fadeOut, 1, 1.0, smooth
    animation = inputField, 1, 1.5, smooth
}

background {
    monitor =
    path = ~/.cache/hyprlock/current-wallpaper
    color = rgba(15, 18, 25, 1.0)

    blur_passes = 4
    blur_size = 1
    noise = 0.015
    contrast = 0.9
    brightness = 0.72
    vibrancy = 0.12
    vibrancy_darkness = 0.1
}

# Dark translucent panel behind the unlock controls.
shape {
    monitor =
    size = 460, 390
    color = rgba(10, 12, 18, 0.55)
    rounding = 24

    position = 0, 0
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.45)
}

label {
    monitor =
    text = $TIME
    color = rgba(245, 247, 255, 1.0)
    font_size = 72
    font_family = Sans

    position = 0, 105
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[60000] date '+%A, %B %d'
    color = rgba(190, 198, 216, 1.0)
    font_size = 18
    font_family = Sans

    position = 0, 45
    halign = center
    valign = center
}

label {
    monitor =
    text = Welcome back, $USER
    color = rgba(225, 230, 245, 1.0)
    font_size = 20
    font_family = Sans

    position = 0, -25
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2

    inner_color = rgba(25, 30, 42, 0.75)
    outer_color = rgba(130, 160, 255, 0.9)
    font_color = rgba(245, 247, 255, 1.0)

    check_color = rgba(130, 220, 170, 1.0)
    fail_color = rgba(255, 110, 125, 1.0)
    capslock_color = rgba(255, 200, 110, 1.0)

    placeholder_text = <i>Password…</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    dots_center = true
    dots_size = 0.25
    dots_spacing = 0.2
    fade_on_empty = false
    rounding = 14

    position = 0, -100
    halign = center
    valign = center
}

